  node_dict:
    enabled: true
    port: 5432
  node_name: postgresql
kb.app.database.postgresql.auth.password:
  label: auth
  label_dict:
    required: true
    sensitive: true
  node_dict:
    encrypted: false
    value: secret123
  node_name: password
kb.app.database.postgresql.auth.username:
  label: auth
  label_dict:
    required: true
  node_dict:
    value: db_user
  node_name: username
kb.app.database.postgresql.connection.host:
  label: connection
  label_dict:
    required: true
  node_dict:
    type: hostname
    value: localhost
  node_name: host
kb.app.database.postgresql.connection.max_connections:
  label: connection
  label_dict:
    max: 1000
    min: 1
  node_dict:
    timeout: 30
    value: 100
  node_name: max_connections
