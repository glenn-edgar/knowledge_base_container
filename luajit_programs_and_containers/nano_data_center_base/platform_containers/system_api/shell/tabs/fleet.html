<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fleet Overview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #e0e0e0; padding: 1rem; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #333; }
    .header h1 { font-size: 1.1rem; color: #64ffda; }

    .summary-bar {
      display: flex; gap: 1.5rem; margin-bottom: 1rem;
    }
    .summary-card {
      background: #16213e; border: 1px solid #333; border-radius: 6px;
      padding: 0.75rem 1.25rem; min-width: 140px; text-align: center;
    }
    .summary-card .num { font-size: 1.5rem; color: #64ffda; font-weight: bold; }
    .summary-card .desc { font-size: 0.75rem; color: #8b949e; margin-top: 0.25rem; }

    .section-title { font-size: 0.85rem; color: #90caf9; margin-bottom: 0.5rem; margin-top: 1.25rem; }

    .domain-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .domain-table th {
      text-align: left; color: #90caf9; padding: 6px 10px;
      border-bottom: 2px solid #333; background: #0d1117;
    }
    .domain-table td { padding: 6px 10px; border-bottom: 1px solid #1c2129; }
    .domain-table tr:hover td { background: #1c2129; }
    .badge { background: #0f3460; padding: 0.1rem 0.35rem; border-radius: 3px; font-size: 0.7rem; color: #90caf9; }
    .badge.live { background: #1b5e20; color: #a5d6a7; }
    .badge.offline { background: #b71c1c; color: #ef9a9a; }
    .badge.stale { background: #e65100; color: #ffcc80; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Fleet Overview</h1>
  </div>

  <div class="summary-bar">
    <div class="summary-card">
      <div class="num" id="total-domains">-</div>
      <div class="desc">Domains</div>
    </div>
    <div class="summary-card">
      <div class="num" id="total-robots">-</div>
      <div class="desc">Robots</div>
    </div>
    <div class="summary-card">
      <div class="num" id="active-missions">-</div>
      <div class="desc">Active Missions</div>
    </div>
    <div class="summary-card">
      <div class="num" id="total-containers">-</div>
      <div class="desc">Containers</div>
    </div>
  </div>

  <div class="section-title">Domains</div>
  <table class="domain-table">
    <thead>
      <tr><th>Domain</th><th>NATS Prefix</th><th>Robots</th><th>Status</th></tr>
    </thead>
    <tbody id="domain-body">
    </tbody>
  </table>

  <div class="section-title">All Robots</div>
  <table class="domain-table">
    <thead>
      <tr><th>Robot</th><th>Domain</th><th>Transport</th><th>Wire</th><th>Capabilities</th></tr>
    </thead>
    <tbody id="robot-body">
    </tbody>
  </table>

  <script>
    var allDomains = [];
    var allRobots = [];

    async function loadFleet() {
      try {
        // Load domains
        var dResp = await fetch("/api/domains");
        var dData = await dResp.json();
        allDomains = dData.domains || [];
        document.getElementById("total-domains").textContent = allDomains.length;

        // Render domain table
        var dBody = document.getElementById("domain-body");
        dBody.innerHTML = "";
        for (var i = 0; i < allDomains.length; i++) {
          var d = allDomains[i];
          var tr = document.createElement("tr");
          tr.innerHTML =
            '<td>' + d.name + '</td>' +
            '<td style="color:#666">' + (d.nats_prefix || "-") + '</td>' +
            '<td id="domain-robots-' + d.name + '">...</td>' +
            '<td><span class="badge">loaded</span></td>';
          dBody.appendChild(tr);
        }

        // Load robots per domain
        var totalRobots = 0;
        var rBody = document.getElementById("robot-body");
        rBody.innerHTML = "";

        for (var i = 0; i < allDomains.length; i++) {
          var d = allDomains[i];
          try {
            var rResp = await fetch("/api/robots?domain=" + d.name);
            var rData = await rResp.json();
            var rawRobots = rData.robots;
            var robots = Array.isArray(rawRobots) ? rawRobots : Object.values(rawRobots || {});
            totalRobots += robots.length;

            // Update domain row count
            var cell = document.getElementById("domain-robots-" + d.name);
            if (cell) cell.textContent = robots.length;

            // Add to all-robots table
            for (var j = 0; j < robots.length; j++) {
              var r = robots[j];
              var tr = document.createElement("tr");
              var caps = (r.capabilities || []).join(", ");
              tr.innerHTML =
                '<td style="color:#64ffda">' + r.name + '</td>' +
                '<td>' + d.name + '</td>' +
                '<td><span class="badge">' + (r.transport || "mqtt") + '</span></td>' +
                '<td><span class="badge">' + (r.wire_format || "json") + '</span></td>' +
                '<td style="color:#666;font-size:0.7rem">' + caps + '</td>';
              rBody.appendChild(tr);
            }
          } catch(e) {
            console.warn("Failed loading robots for " + d.name);
          }
        }

        document.getElementById("total-robots").textContent = totalRobots;
        document.getElementById("active-missions").textContent = "0";

        // Load containers
        try {
          var cResp = await fetch("/api/containers?cpu=cpu_01");
          var cData = await cResp.json();
          var cList = cData.containers;
          var cCount = Array.isArray(cList) ? cList.length : Object.keys(cList || {}).length;
          document.getElementById("total-containers").textContent = cCount;
        } catch(e) {
          document.getElementById("total-containers").textContent = "?";
        }

      } catch(e) {
        console.error("Fleet load error:", e);
      }
    }

    loadFleet();
  </script>
</body>
</html>
