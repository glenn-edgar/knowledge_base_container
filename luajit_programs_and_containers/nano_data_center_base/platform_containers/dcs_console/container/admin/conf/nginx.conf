# dcs_console :: admin slot -- Phase 1 (shell only; real content later).
#
# Serves the reusable dcs_shell (hamburger drawer + context-aware header +
# status popup with SSE). The shell HTML is static (admin/html/index.html);
# the tree is hand-rolled for phase 1 and will become pg-driven in phase 2+.
# All dynamic endpoints use content_by_lua_file so nginx's parser never
# has to chew on large inline Lua blocks.

worker_processes 1;
error_log  stderr info;
pid        /tmp/nginx_dcs_console_admin.pid;

# Shell doesn't touch pg yet; declared now so later phases that read pg
# don't require a Dockerfile rebuild.
env PG_HOST;
env PG_PORT;
env PG_DB;
env PG_USER;
env PG_PASSWORD;
env APP_SYSTEM;
env APP_SITE;
env APP_CPU_ID;
env CONTAINER_NAME;

events {
    worker_connections 64;
}

http {
    # Built-in MIME map so .css / .js / .html / .json assets get correct
    # Content-Type. Without this, default_type below stamps everything
    # text/html and browsers refuse to apply the stylesheet / run JS as
    # module-strict.
    include       /usr/local/openresty/nginx/conf/mime.types;

    access_log          stderr;
    default_type        text/html;
    client_body_temp_path /tmp/nginx_dcs_console_admin_body_temp;
    proxy_temp_path       /tmp/nginx_dcs_console_admin_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_dcs_console_admin_fcgi_temp;
    uwsgi_temp_path       /tmp/nginx_dcs_console_admin_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_dcs_console_admin_scgi_temp;

    lua_package_path "/opt/apps/admin/lua/?.lua;;";

    server {
        listen 8081;

        # ---- shell page (server-rendered with pg-driven tree) ---------
        # Phase 3+: tree reflects current CPU roster + CONTAINER_REGISTRY
        # state on each full-page load. Fragments inside the shell are
        # htmx-swapped without re-rendering the tree; refresh to pick up
        # new containers / CPUs.
        location = / {
            content_by_lua_file /opt/apps/admin/lua/shell_page.lua;
        }

        location /assets/ {
            alias /usr/local/openresty/site/assets/;
            access_log off;
        }

        # ---- dynamic endpoints ----------------------------------------
        location ~ ^/fragment/(.*)$ {
            content_by_lua_file /opt/apps/admin/lua/fragment.lua;
        }
        location ~ ^/status/(.*)$ {
            content_by_lua_file /opt/apps/admin/lua/status.lua;
        }
        location ~ ^/sse/(.*)$ {
            content_by_lua_file /opt/apps/admin/lua/sse.lua;
        }
        location ~ ^/action/(.*)$ {
            content_by_lua_file /opt/apps/admin/lua/action.lua;
        }

        # ---- metadata -------------------------------------------------
        location = /__info__ {
            default_type application/json;
            return 200 '{"slot":"admin","container":"dcs_console","status":"shell-v1"}';
        }
    }
}
