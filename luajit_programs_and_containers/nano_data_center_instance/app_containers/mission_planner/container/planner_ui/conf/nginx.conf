# planner_ui :: Phase 5b C1 chassis.
#
# Phase B.2 introduced a SHELL placeholder; C1 replaces the inline HTML
# with a proper handler chassis modeled on dcs_console/admin:
#   - lua_package_path so handlers can require shared modules
#   - content_by_lua_file per route
#   - env declarations for future pg/NATS reads (declared now so later
#     sub-commits don't need a Dockerfile rebuild; openresty workers
#     strip env vars by default per feedback_nginx_env_directive.md)
#   - /assets/ location stub for the static map renderer (5b C3+)
#   - /health for liveness; /__info__ kept for slot-metadata compat
#
# Internal port 8090 (matches manifest.ui_protocol.port_internal).

worker_processes 1;
error_log  stderr info;
pid        /tmp/nginx_planner_ui.pid;

# Declared now; consumed by later sub-commits (5b C2 read API).
env PG_HOST;
env PG_PORT;
env PG_DB;
env PG_USER;
env PG_PASSWORD;
env APP_SYSTEM;
env APP_SITE;
env APP_CPU_ID;
env CONTAINER_NAME;
env PLANNER_NAMESPACE;
env NATS_URL;

events {
    worker_connections 64;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;

    access_log          stderr;
    default_type        text/html;
    client_body_temp_path /tmp/nginx_planner_ui_body_temp;
    proxy_temp_path       /tmp/nginx_planner_ui_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_planner_ui_fcgi_temp;
    uwsgi_temp_path       /tmp/nginx_planner_ui_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_planner_ui_scgi_temp;

    lua_package_path "/opt/apps/planner_ui/lua/?.lua;;";

    server {
        listen 8090;

        # Shell page (server-rendered; htmx-swapped fragments inside).
        # Placeholder content for now -- the SVG map renderer + mission
        # status overlay land in 5b C3 / C6 respectively.
        location = / {
            content_by_lua_file /opt/apps/planner_ui/lua/shell_page.lua;
        }

        # Liveness check. Returns 200 + a small JSON probe; used by
        # node_control's HTTP watchdog to confirm the worker is alive.
        location = /health {
            default_type application/json;
            content_by_lua_file /opt/apps/planner_ui/lua/health.lua;
        }

        # Static asset bundle for the map renderer (5b C3+). Stubbed
        # now -- the alias path doesn't exist until C3 ships it; nginx
        # returns 404 cleanly until then.
        location /assets/ {
            alias /opt/apps/planner_ui/assets/;
            access_log off;
        }

        # Slot metadata (kept for compat with platform tooling that
        # discovers containers by GET /__info__).
        location = /__info__ {
            default_type application/json;
            return 200 '{"slot":"planner_ui","container":"mission_planner","status":"chassis-c1"}';
        }
    }
}
