# planner_ui/conf/nginx.conf -- SHELL.
# Internal port 8090 (matches manifest.ui_protocol.port_internal).
# One static page. Pid + temp paths under /tmp.

worker_processes 1;
error_log  stderr info;
pid        /tmp/nginx_planner_ui.pid;

events {
    worker_connections 64;
}

http {
    access_log          stderr;
    default_type        text/html;
    client_body_temp_path /tmp/nginx_planner_ui_body_temp;
    proxy_temp_path       /tmp/nginx_planner_ui_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_planner_ui_fcgi_temp;
    uwsgi_temp_path       /tmp/nginx_planner_ui_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_planner_ui_scgi_temp;

    server {
        listen 8090;

        location / {
            return 200 '<!doctype html>
<meta charset="utf-8">
<title>mission_planner :: planner_ui (shell)</title>
<style>body{font-family:monospace;background:#111;color:#ddd;padding:2em}
h1{color:#fff}code{background:#222;padding:0.1em 0.4em;border-radius:3px}</style>
<h1>mission_planner :: planner_ui</h1>
<p><strong>SHELL</strong> &mdash; placeholder for the mission_planner
operator UI. Populated in Phase B.2 once the planner library lands.</p>
<p>When filled in, this page will expose mission graphs, transit paths,
energy budgets, and active exceptions from the planner worker that runs
alongside in this same container.</p>
<p>Hit <a href="/__info__">/__info__</a> for slot metadata.</p>';
        }

        location = /__info__ {
            return 200 '{"slot":"planner_ui","container":"mission_planner","status":"shell"}';
        }
    }
}
