# planner_ui :: Phase 5b C1 chassis.
#
# Phase B.2 introduced a SHELL placeholder; C1 replaces the inline HTML
# with a proper handler chassis modeled on dcs_console/admin:
#   - lua_package_path so handlers can require shared modules
#   - content_by_lua_file per route
#   - env declarations for future pg/NATS reads (declared now so later
#     sub-commits don't need a Dockerfile rebuild; openresty workers
#     strip env vars by default per feedback_nginx_env_directive.md)
#   - /assets/ location stub for the static map renderer (5b C3+)
#   - /health for liveness; /__info__ kept for slot-metadata compat
#
# Internal port 8090 (matches manifest.ui_protocol.port_internal).

worker_processes 1;
error_log  stderr info;
pid        /tmp/nginx_planner_ui.pid;

# Declared now; consumed by later sub-commits (5b C2 read API).
env PG_HOST;
env PG_PORT;
env PG_DB;
env PG_USER;
env PG_PASSWORD;
env APP_SYSTEM;
env APP_SITE;
env APP_CPU_ID;
env CONTAINER_NAME;
env PLANNER_NAMESPACE;
env NATS_URL;

events {
    worker_connections 64;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;

    access_log          stderr;
    default_type        text/html;
    client_body_temp_path /tmp/nginx_planner_ui_body_temp;
    proxy_temp_path       /tmp/nginx_planner_ui_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_planner_ui_fcgi_temp;
    uwsgi_temp_path       /tmp/nginx_planner_ui_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_planner_ui_scgi_temp;

    # planner_ui handlers + the planner worker's lib/ tree (so submit.lua
    # can require("lib.nats_key_store") / require("lib.nats_job_queue")
    # for direct FFI mission enqueue, Phase 5b C5). Both apps live in
    # the same container; the .so files are in /usr/local/lib/ and
    # ldconfig'd by the Dockerfile, so ffi.load("nats_job_queue")
    # resolves through the system loader.
    lua_package_path "/opt/apps/planner_ui/lua/?.lua;/opt/apps/planner/lib/?.lua;;";

    server {
        listen 8090;

        # Shell page (server-rendered; htmx-swapped fragments inside).
        # Placeholder content for now -- the SVG map renderer + mission
        # status overlay land in 5b C3 / C6 respectively.
        location = / {
            content_by_lua_file /opt/apps/planner_ui/lua/shell_page.lua;
        }

        # Liveness check. Returns 200 + a small JSON probe; used by
        # node_control's HTTP watchdog to confirm the worker is alive.
        location = /health {
            default_type application/json;
            content_by_lua_file /opt/apps/planner_ui/lua/health.lua;
        }

        # ---- Read API (Phase 5b C2) ----------------------------------
        # All single-tenant for now; multi-tenant filter deferred to
        # Phase 7 KB schema decision. Errors return JSON envelopes:
        #   404 board not found
        #   500 SQL error / pgmoon failure
        #   503 cannot connect to pg

        # GET /api/boards -> list of {name, sha256_hex, updated_at, size}
        location = /api/boards {
            content_by_lua_file /opt/apps/planner_ui/lua/api_boards.lua;
        }

        # GET /api/board/<name> -> compiled board JSON (verbatim);
        # X-Board-SHA256 header for client-side cache busting. The
        # PCRE captures the name into ngx.var[1]; api_board.lua
        # additionally sanity-checks via Lua-side regex (defense in
        # depth -- the nginx route already filters non-word chars).
        location ~ ^/api/board/([A-Za-z0-9_]+)$ {
            content_by_lua_file /opt/apps/planner_ui/lua/api_board.lua;
        }

        # GET /api/active_nodes -> list of {path, name, data}.
        location = /api/active_nodes {
            content_by_lua_file /opt/apps/planner_ui/lua/api_active_nodes.lua;
        }

        # ---- Mission launcher (Phase 5b C5) --------------------------
        # POST /api/submit_mission -> 200 {job_id, queue}
        # Body: {"robot_id":..., "board":..., "source":..., "target":...}
        # Direct FFI to libnats_job_queue (option 4 design): same
        # container as planner worker, ~1-5ms blocking submit. 16k body
        # cap is generous -- a mission JSON is ~200 bytes.
        location = /api/submit_mission {
            client_max_body_size 16k;
            content_by_lua_file /opt/apps/planner_ui/lua/api_submit_mission.lua;
        }

        # Static asset bundle for the map renderer (5b C3+). Stubbed
        # now -- the alias path doesn't exist until C3 ships it; nginx
        # returns 404 cleanly until then.
        location /assets/ {
            alias /opt/apps/planner_ui/assets/;
            access_log off;
        }

        # Slot metadata (kept for compat with platform tooling that
        # discovers containers by GET /__info__).
        location = /__info__ {
            default_type application/json;
            return 200 '{"slot":"planner_ui","container":"mission_planner","status":"chassis-c1"}';
        }
    }
}
