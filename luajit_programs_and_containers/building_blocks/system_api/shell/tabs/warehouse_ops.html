<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warehouse Operations</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #e0e0e0; padding: 1.5rem; }
    .splash { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center; }
    .splash h1 { font-size: 1.5rem; color: #64ffda; margin-bottom: 0.5rem; }
    .splash .subtitle { color: #90caf9; font-size: 0.9rem; margin-bottom: 2rem; }
    .splash .prefix { color: #666; font-size: 0.8rem; margin-bottom: 2rem; }
    .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; width: 100%; max-width: 800px; margin-bottom: 2rem; }
    .status-card { background: #16213e; border: 1px solid #333; border-radius: 6px; padding: 1rem; }
    .status-card h3 { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .status-card .value { font-size: 1.2rem; color: #64ffda; }
    .status-card .detail { font-size: 0.75rem; color: #888; margin-top: 0.25rem; }
    .robot-list { width: 100%; max-width: 800px; }
    .robot-row { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem; background: #16213e; border: 1px solid #333; border-radius: 4px; margin-bottom: 0.5rem; }
    .robot-name { color: #64ffda; font-weight: bold; min-width: 100px; }
    .robot-status { font-size: 0.8rem; padding: 0.2rem 0.5rem; border-radius: 3px; }
    .robot-status.offline { background: #b71c1c; color: #ef9a9a; }
    .badge { background: #0f3460; padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.75rem; color: #90caf9; }
    .caps { color: #888; font-size: 0.75rem; }
    #conn-status { font-size: 0.8rem; padding: 0.25rem 0.75rem; border-radius: 4px; position: absolute; top: 1rem; right: 1.5rem; }
    #conn-status.ok { background: #1b5e20; color: #a5d6a7; }
    #conn-status.err { background: #b71c1c; color: #ef9a9a; }
    #conn-status.connecting { background: #e65100; color: #ffcc80; }
  </style>
</head>
<body>
  <span id="conn-status" class="connecting">Connecting...</span>

  <div class="splash">
    <h1>Warehouse Operations</h1>
    <div class="subtitle">Moon Base Alpha — Warehouse Logistics Domain</div>
    <div class="prefix" id="nats-prefix">loading...</div>

    <div class="status-grid">
      <div class="status-card">
        <h3>Domain</h3>
        <div class="value" id="domain-name">---</div>
        <div class="detail" id="container-path">---</div>
      </div>
      <div class="status-card">
        <h3>Robots</h3>
        <div class="value" id="robot-count">---</div>
        <div class="detail">registered</div>
      </div>
      <div class="status-card">
        <h3>Planner</h3>
        <div class="value">Logistics Planner</div>
        <div class="detail">idle</div>
      </div>
      <div class="status-card">
        <h3>Facility</h3>
        <div class="value">Warehouse A</div>
        <div class="detail">3 aisles, 12 bays</div>
      </div>
    </div>

    <div class="robot-list" id="robot-list"></div>
  </div>

  <script>
    const DOMAIN = "warehouse_ops";

    async function init() {
      try {
        const domResp = await fetch("/api/domains");
        const domData = await domResp.json();
        const d = (domData.domains || []).find(x => x.name === DOMAIN);
        if (d) {
          document.getElementById("domain-name").textContent = d.name;
          document.getElementById("nats-prefix").textContent = d.nats_prefix;
          document.getElementById("container-path").textContent = d.container;
        }

        const robResp = await fetch("/api/robots?domain=" + DOMAIN);
        const robData = await robResp.json();
        const robots = robData.robots || [];
        document.getElementById("robot-count").textContent = robots.length;

        const list = document.getElementById("robot-list");
        list.innerHTML = "";
        for (const r of robots) {
          const caps = (r.capabilities || []).join(", ");
          list.innerHTML +=
            '<div class="robot-row">' +
              '<span class="robot-name">' + r.name + '</span>' +
              '<span class="robot-status offline">offline</span>' +
              '<span class="badge">' + r.transport + '</span>' +
              '<span class="badge">' + r.wire_format + '</span>' +
              '<span class="caps">' + caps + '</span>' +
            '</div>';
        }

        document.getElementById("conn-status").textContent = "OK";
        document.getElementById("conn-status").className = "ok";
      } catch(e) {
        document.getElementById("conn-status").textContent = "API Error";
        document.getElementById("conn-status").className = "err";
        console.error(e);
      }
    }

    init();
  </script>
</body>
</html>
