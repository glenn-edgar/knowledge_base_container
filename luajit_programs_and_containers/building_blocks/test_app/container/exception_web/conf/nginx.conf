# exception_web/conf/nginx.conf -- SHELL.
# Internal port 8080. Returns one static page.
# Pid + temp paths pinned under /tmp so we don't depend on the prefix dir
# layout.

worker_processes 1;
error_log  stderr info;
pid        /tmp/nginx_exception_web.pid;

events {
    worker_connections 64;
}

http {
    access_log          stderr;
    default_type        text/html;
    client_body_temp_path /tmp/nginx_exception_web_body_temp;
    proxy_temp_path       /tmp/nginx_exception_web_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_exception_web_fcgi_temp;
    uwsgi_temp_path       /tmp/nginx_exception_web_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_exception_web_scgi_temp;

    server {
        listen 8080;

        location / {
            return 200 '<!doctype html>
<meta charset="utf-8">
<title>test_app :: exception view</title>
<style>body{font-family:monospace;background:#111;color:#ddd;padding:2em}</style>
<h1>test_app :: exception_web (shell)</h1>
<p>Registration-test page. Served by openresty on internal port 8080.</p>
<p>No real data yet -- the aggregator would write here in a future stage.</p>';
        }
    }
}
