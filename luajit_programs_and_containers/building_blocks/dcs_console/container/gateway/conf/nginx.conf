# dcs_console :: gateway slot -- site-wide reverse proxy.
#
# Polls CONTAINER_REGISTRY via pgmoon, caches the route table in
# lua_shared_dict ui_registry, and routes /ui/<container>/<slot>/<rest>
# to host.docker.internal:<external_port>. Landing page at / lists all
# routable UIs. See lua/poller.lua + lua/route.lua + lua/landing.lua.

worker_processes 1;
error_log  stderr info;
pid        /tmp/nginx_dcs_console_gateway.pid;

# Expose env vars to workers. nginx wipes all but a tiny whitelist (TZ, PATH)
# from worker processes; any var os.getenv() needs must be re-declared here.
# These are injected by node_control's docker run in user_functions.lua.
env PG_HOST;
env PG_PORT;
env PG_DB;
env PG_USER;
env PG_PASSWORD;
env APP_SITE;
env APP_CPU_ID;
env CONTAINER_NAME;

events {
    worker_connections 256;
}

http {
    access_log          stderr;
    default_type        text/html;
    client_body_temp_path /tmp/nginx_dcs_console_gateway_body_temp;
    proxy_temp_path       /tmp/nginx_dcs_console_gateway_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_dcs_console_gateway_fcgi_temp;
    uwsgi_temp_path       /tmp/nginx_dcs_console_gateway_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_dcs_console_gateway_scgi_temp;

    # No nginx resolver directive: the poller resolves host.docker.internal
    # from /etc/hosts at startup and stores literal IPs in the route table,
    # so proxy_pass http://$gw_upstream/... never triggers a DNS lookup.
    # (Docker Desktop's 127.0.0.11 embedded DNS is unreliable on the default
    # bridge; avoiding it entirely is simpler than pinning a user-defined
    # network.)

    # WebSocket upgrade plumbing: preserve Upgrade/Connection on proxy_pass.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    lua_package_path "/opt/apps/gateway/lua/?.lua;;";
    lua_shared_dict  ui_registry 1m;

    # Spawn the poller once per worker. worker_processes=1, so exactly once.
    init_worker_by_lua_file /opt/apps/gateway/lua/poller.lua;

    server {
        listen 8080;

        # Landing: sidebar catalog + tab strip + iframe stack. Pure
        # frontend tab manager (open/focus/close, persisted in
        # localStorage). The 404-body path in route.lua still uses the
        # plain table (landing.render(404)) so a bad direct URL doesn't
        # render the full workspace.
        location = / {
            content_by_lua_block {
                require("landing").render_tabs()
            }
        }

        location = /__info__ {
            return 200 '{"slot":"gateway","container":"dcs_console","status":"live"}';
        }

        # Trailing-slash normalize: /ui/c/s -> /ui/c/s/ (before the proxy
        # regex). nginx picks the FIRST matching regex location.
        location ~ ^/ui/([^/]+)/([^/]+)$ {
            return 301 /ui/$1/$2/;
        }

        # Reverse proxy: /ui/<container>/<slot>/<rest>.
        # access_by_lua looks the route up in the cache, sets $gw_upstream
        # (host.docker.internal:<ext>) or short-circuits with 503/404.
        location ~ ^/ui/([^/]+)/([^/]+)/(.*)$ {
            set $container     $1;
            set $slot          $2;
            set $rest          $3;
            set $gw_upstream "";

            access_by_lua_file /opt/apps/gateway/lua/route.lua;

            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   X-Gateway-Container $container;
            proxy_set_header   X-Gateway-Slot     $slot;

            # WebSocket upgrade headers + long read timeout so a ws stream
            # doesn't hit nginx's default 60s read timeout.
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         $connection_upgrade;
            proxy_read_timeout 1h;

            proxy_pass http://$gw_upstream/$rest$is_args$args;
        }

        # Upstream-down fallback. nginx triggers this on 502/504 from the
        # proxy above. Plain body (design: 6b).
        error_page 502 504 =502 /__gateway_502;
        location = /__gateway_502 {
            internal;
            default_type text/plain;
            return 502 "Bad gateway: upstream unreachable.\n";
        }
    }
}
