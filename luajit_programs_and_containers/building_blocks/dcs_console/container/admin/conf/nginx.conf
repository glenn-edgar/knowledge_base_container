# dcs_console :: admin slot -- SHELL.
# Internal port 8081. Returns a stub page. Will become a real operator
# admin UI backed by pgmoon reads of knowledge_base + knowledge_base_status
# (registry, SYS_EXCEPTION, heartbeats, system_ready flag).

worker_processes 1;
error_log  stderr info;
pid        /tmp/nginx_dcs_console_admin.pid;

events {
    worker_connections 64;
}

http {
    access_log          stderr;
    default_type        text/html;
    client_body_temp_path /tmp/nginx_dcs_console_admin_body_temp;
    proxy_temp_path       /tmp/nginx_dcs_console_admin_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_dcs_console_admin_fcgi_temp;
    uwsgi_temp_path       /tmp/nginx_dcs_console_admin_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_dcs_console_admin_scgi_temp;

    server {
        listen 8081;

        location / {
            return 200 '<!doctype html>
<meta charset="utf-8">
<title>dcs_console :: admin (shell)</title>
<style>body{font-family:monospace;background:#111;color:#ddd;padding:2em}
code{background:#222;padding:0.1em 0.4em;border-radius:3px}</style>
<h1>dcs_console :: admin</h1>
<p><strong>SHELL</strong> &mdash; placeholder for the DCS operator admin UI.</p>
<p>When filled in, this server will read from
<code>knowledge_base</code> + <code>knowledge_base_status</code> via pgmoon
and present: registered containers, active <code>SYS_EXCEPTION</code>s,
per-CPU heartbeat freshness, and the site-wide
<code>system_ready</code> flag.</p>
<p>Hit <a href="/__info__">/__info__</a> for slot metadata.</p>';
        }

        location = /__info__ {
            return 200 '{"slot":"admin","container":"dcs_console","status":"shell"}';
        }
    }
}
