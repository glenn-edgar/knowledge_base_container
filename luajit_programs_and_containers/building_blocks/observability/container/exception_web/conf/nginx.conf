# exception_web/conf/nginx.conf -- SHELL (Phase 5).
# Internal port 8080. Serves one stub page identifying itself.
# Phase 8 replaces this with the 5-view alarm ops UI
# (Site Overview, Active Alarms, Alarm Detail, Alarm Journal, Shelved).

worker_processes 1;
error_log  stderr info;
pid        /tmp/nginx_exception_web.pid;

events {
    worker_connections 64;
}

http {
    access_log          stderr;
    default_type        text/html;
    client_body_temp_path /tmp/nginx_exception_web_body_temp;
    proxy_temp_path       /tmp/nginx_exception_web_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_exception_web_fcgi_temp;
    uwsgi_temp_path       /tmp/nginx_exception_web_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_exception_web_scgi_temp;

    server {
        listen 8080;

        location / {
            return 200 '<!doctype html>
<meta charset="utf-8">
<title>observability :: exception_web</title>
<style>body{font-family:monospace;background:#111;color:#ddd;padding:2em}
h1{color:#f6a}h2{color:#8c8}pre{background:#222;padding:1em;border-radius:4px}</style>
<h1>observability :: exception_web (Phase 5 shell)</h1>
<p>SCADA-style alarm ops UI. Internal port 8080.</p>
<h2>Views coming in Phase 8</h2>
<ul>
<li>Site Overview &mdash; readiness + active alarm counts by priority</li>
<li>Active Alarms &mdash; table, sortable, click-through detail</li>
<li>Alarm Detail &mdash; state / signatures / history / ack+shelve controls</li>
<li>Alarm Journal &mdash; append-only state-transition log</li>
<li>Shelved Alarms &mdash; operator rationalization mutes with auto-unshelve</li>
</ul>
<p>Backed by <code>SYS_EXCEPTION</code> nested headers
(<code>state</code>, <code>priority</code>, <code>signatures[]</code>,
<code>last_raised_ts</code>, etc.). See
<code>project_dcs_task4_design.md</code>.</p>';
        }

        location = /__info__ {
            default_type application/json;
            return 200 '{"app":"exception_web","port":8080,"phase":5,"shell":true}';
        }
    }
}
