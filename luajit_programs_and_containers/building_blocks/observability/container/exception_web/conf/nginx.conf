# exception_web/conf/nginx.conf -- Phase 8a.
#
# Two server-rendered views backed by pgmoon against the master KB:
#   /           -> redirect to /overview
#   /overview   -> site overview (priority counts + recent events)
#   /alarms     -> flat table of non-NORMAL SYS_EXCEPTIONs
#
# Phase 8b adds: /detail/<path>, /journal, /shelved + htmx-backed
# ack/shelve POST handlers.

worker_processes 1;
error_log  stderr info;
pid        /tmp/nginx_observability_exception_web.pid;

# Env vars that node_control passes at docker run. openresty workers
# strip these from their env by default; declare here to re-expose.
env PG_HOST;
env PG_PORT;
env PG_DB;
env PG_USER;
env PG_PASSWORD;
env POSTGRES_PASSWORD;
env APP_NAME;
env CONTAINER_NAME;

events {
    worker_connections 64;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  text/html;
    access_log    stderr;

    client_body_temp_path /tmp/nginx_observability_exception_web_body_temp;
    proxy_temp_path       /tmp/nginx_observability_exception_web_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_observability_exception_web_fcgi_temp;
    uwsgi_temp_path       /tmp/nginx_observability_exception_web_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_observability_exception_web_scgi_temp;

    # View lua lives under lua/. Staged DCS libs (kb_exception etc.) are
    # at /opt/apps/lib/ for any future cross-cutting code.
    lua_package_path "/opt/apps/exception_web/lua/?.lua;/opt/apps/lib/?.lua;;";

    server {
        listen 8080;

        # Root redirects to the homepage view.
        location = / {
            return 302 /overview;
        }

        location = /overview {
            content_by_lua_file /opt/apps/exception_web/lua/site_overview.lua;
        }

        location = /alarms {
            content_by_lua_file /opt/apps/exception_web/lua/active_alarms.lua;
        }

        # Placeholders for Phase 8b views. 404 with hint rather than the
        # Phase 5 stub page — keeps nav tabs honest about what's wired.
        location = /journal {
            return 404 '<!doctype html><title>Not yet</title>
<style>body{font-family:monospace;background:#111;color:#ddd;padding:2em}</style>
<h1>Alarm Journal</h1><p>Arrives in Phase 8b.</p>
<p><a href="/overview" style="color:#6af">&larr; Site Overview</a></p>';
        }
        location = /shelved {
            return 404 '<!doctype html><title>Not yet</title>
<style>body{font-family:monospace;background:#111;color:#ddd;padding:2em}</style>
<h1>Shelved Alarms</h1><p>Arrives in Phase 8b.</p>
<p><a href="/overview" style="color:#6af">&larr; Site Overview</a></p>';
        }

        # Metadata probe for gateway.
        location = /__info__ {
            default_type application/json;
            return 200 '{"app":"exception_web","port":8080,"phase":"8a","views":["/overview","/alarms"]}';
        }
    }
}
