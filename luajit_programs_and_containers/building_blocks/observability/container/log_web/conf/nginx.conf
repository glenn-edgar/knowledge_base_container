# log_web/conf/nginx.conf -- SHELL (Phase 5).
# Internal port 8081. Serves one stub page identifying itself.
# Phase 8 replaces this with the 4-view log / strip-chart UI
# (Live Operational, Log Detail, Archival Browser, Rule Inventory).

worker_processes 1;
error_log  stderr info;
pid        /tmp/nginx_log_web.pid;

events {
    worker_connections 64;
}

http {
    access_log          stderr;
    default_type        text/html;
    client_body_temp_path /tmp/nginx_log_web_body_temp;
    proxy_temp_path       /tmp/nginx_log_web_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_log_web_fcgi_temp;
    uwsgi_temp_path       /tmp/nginx_log_web_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_log_web_scgi_temp;

    server {
        listen 8081;

        location / {
            return 200 '<!doctype html>
<meta charset="utf-8">
<title>observability :: log_web</title>
<style>body{font-family:monospace;background:#111;color:#ddd;padding:2em}
h1{color:#6af}h2{color:#8c8}pre{background:#222;padding:1em;border-radius:4px}</style>
<h1>observability :: log_web (Phase 5 shell)</h1>
<p>Strip-chart + rule inventory UI. Internal port 8081.</p>
<h2>Views coming in Phase 8</h2>
<ul>
<li>Live Operational &mdash; mini strip-chart grid over all operational logs</li>
<li>Log Detail &mdash; full strip chart with MA + envelope + rule-trip markers</li>
<li>Archival Browser &mdash; multi-log overlay for year/month zoom</li>
<li>Rule Inventory &mdash; flat table of every <code>KB_RULE</code></li>
</ul>
<p>uPlot for time-series canvas renderer. Data source: <code>KB_LOG</code>
samples ring (tier-0) and the <code>rollups</code> table (tier-1/2/3).</p>';
        }

        location = /__info__ {
            default_type application/json;
            return 200 '{"app":"log_web","port":8081,"phase":5,"shell":true}';
        }
    }
}
