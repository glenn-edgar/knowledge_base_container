# log_web/conf/nginx.conf -- Phase 8c.
#
# Views served:
#   /           -> /detail (log picker)
#   /detail     -> index (when no path) OR strip chart + rules panel
#   /static/*   -> uPlot.iife.min.js / uPlot.min.css (vendored)
#   /live, /archival, /rules -> placeholder (Phase 8d)

worker_processes 1;
error_log  stderr info;
pid        /tmp/nginx_observability_log_web.pid;

env PG_HOST;
env PG_PORT;
env PG_DB;
env PG_USER;
env PG_PASSWORD;
env POSTGRES_PASSWORD;
env APP_NAME;
env CONTAINER_NAME;

events {
    worker_connections 64;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  text/html;
    access_log    stderr;

    client_body_temp_path /tmp/nginx_observability_log_web_body_temp;
    proxy_temp_path       /tmp/nginx_observability_log_web_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_observability_log_web_fcgi_temp;
    uwsgi_temp_path       /tmp/nginx_observability_log_web_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_observability_log_web_scgi_temp;

    lua_package_path "/opt/apps/log_web/lua/?.lua;/opt/apps/lib/?.lua;;";

    server {
        listen 8081;

        location = / {
            return 302 /detail;
        }

        location = /detail {
            content_by_lua_file /opt/apps/log_web/lua/log_detail.lua;
        }

        # Vendored uPlot assets + any future static files.
        location /static/ {
            alias /opt/apps/log_web/static/;
            access_log off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        # Phase 8d placeholders
        location = /live {
            return 404 '<!doctype html><title>Not yet</title>
<style>body{font-family:monospace;background:#111;color:#ddd;padding:2em}</style>
<h1>Live Operational</h1><p>Arrives in Phase 8d.</p>
<p><a href="/detail" style="color:#6af">&larr; Log Detail</a></p>';
        }
        location = /archival {
            return 404 '<!doctype html><title>Not yet</title>
<style>body{font-family:monospace;background:#111;color:#ddd;padding:2em}</style>
<h1>Archival Browser</h1><p>Arrives in Phase 8d.</p>
<p><a href="/detail" style="color:#6af">&larr; Log Detail</a></p>';
        }
        location = /rules {
            return 404 '<!doctype html><title>Not yet</title>
<style>body{font-family:monospace;background:#111;color:#ddd;padding:2em}</style>
<h1>Rule Inventory</h1><p>Arrives in Phase 8d.</p>
<p><a href="/detail" style="color:#6af">&larr; Log Detail</a></p>';
        }

        location = /__info__ {
            default_type application/json;
            return 200 '{"app":"log_web","port":8081,"phase":"8c","views":["/detail","/static/*"]}';
        }
    }
}
