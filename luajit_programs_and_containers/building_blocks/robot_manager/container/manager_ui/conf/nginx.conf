# manager_ui/conf/nginx.conf -- SHELL.
# Internal port 8080. One static page. Pid + temp paths under /tmp.

worker_processes 1;
error_log  stderr info;
pid        /tmp/nginx_manager_ui.pid;

events {
    worker_connections 64;
}

http {
    access_log          stderr;
    default_type        text/html;
    client_body_temp_path /tmp/nginx_manager_ui_body_temp;
    proxy_temp_path       /tmp/nginx_manager_ui_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_manager_ui_fcgi_temp;
    uwsgi_temp_path       /tmp/nginx_manager_ui_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_manager_ui_scgi_temp;

    server {
        listen 8080;

        location / {
            return 200 '<!doctype html>
<meta charset="utf-8">
<title>robot_manager :: manager_ui (shell)</title>
<style>body{font-family:monospace;background:#111;color:#ddd;padding:2em}
h1{color:#fff}code{background:#222;padding:0.1em 0.4em;border-radius:3px}</style>
<h1>robot_manager :: manager_ui</h1>
<p><strong>SHELL</strong> &mdash; placeholder for the robot_manager
operator UI. Populated in a later session.</p>
<p>When filled in, this page will show the active robot fleet: per-robot
heartbeats, current mission assignments, battery / zone state, and
exception bits from the manager worker that runs alongside in this
same container.</p>
<p>Hit <a href="/__info__">/__info__</a> for slot metadata.</p>';
        }

        location = /__info__ {
            return 200 '{"slot":"manager_ui","container":"robot_manager","status":"shell"}';
        }
    }
}
