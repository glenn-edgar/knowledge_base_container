worker_processes 1;
error_log /dev/stderr info;

# Pass environment variables to Lua (nginx strips them by default)
env PG_HOST;
env PG_PORT;
env PG_DBNAME;
env PG_USER;
env PG_PASSWORD;
env POSTGRES_PASSWORD;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    access_log    /dev/stdout;

    # Resolve Docker DNS for upstream
    resolver 127.0.0.11 ipv6=off;

    # JSON helper
    lua_shared_dict cache 1m;

    server {
        listen 8080;
        server_name localhost;

        # Static shell files
        location / {
            root /srv/shell;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Tab pages
        location /tabs/ {
            root /srv/shell;
        }

        # Vendor JS
        location /vendor/ {
            root /srv/shell;
            add_header Cache-Control "public, max-age=3600";
        }

        # API: domain discovery (HTTP, no NATS needed)
        location /api/domains {
            default_type application/json;
            content_by_lua_block {
                local pgmoon = require("pgmoon")
                local pg = pgmoon.new({
                    host     = os.getenv("PG_HOST") or "172.17.0.1",
                    port     = tonumber(os.getenv("PG_PORT") or "5432"),
                    database = os.getenv("PG_DBNAME") or "knowledge_base",
                    user     = os.getenv("PG_USER") or "gedgar",
                    password = os.getenv("PG_PASSWORD") or os.getenv("POSTGRES_PASSWORD") or "",
                })

                local ok, err = pg:connect()
                if not ok then
                    ngx.status = 500
                    ngx.say('{"error":"' .. (err or "connect failed") .. '"}')
                    return
                end

                local res, err = pg:query([[
                    SELECT name, properties::text as properties, data::text as data, path::text as path
                    FROM knowledge_base
                    WHERE knowledge_base = 'subsystems' AND label = 'domain'
                    ORDER BY name
                ]])

                pg:keepalive()

                if not res then
                    ngx.status = 500
                    ngx.say('{"error":"' .. (err or "query failed") .. '"}')
                    return
                end

                -- Build JSON response
                local cjson = require("cjson")
                local domains = {}
                for _, row in ipairs(res) do
                    local data = cjson.decode(row.data or "{}")
                    local props = cjson.decode(row.properties or "{}")
                    domains[#domains + 1] = {
                        name        = row.name,
                        path        = row.path,
                        description = props.description or "",
                        nats_prefix = data.nats_prefix or "",
                        container   = data.container or "",
                    }
                end

                ngx.say(cjson.encode({ domains = domains }))
            }
        }

        # API: containers on a CPU
        location /api/containers {
            default_type application/json;
            content_by_lua_block {
                local pgmoon = require("pgmoon")
                local cjson = require("cjson")

                local args = ngx.req.get_uri_args()
                local cpu = args.cpu or "cpu_01"

                local pg = pgmoon.new({
                    host     = os.getenv("PG_HOST") or "172.17.0.1",
                    port     = tonumber(os.getenv("PG_PORT") or "5432"),
                    database = os.getenv("PG_DBNAME") or "knowledge_base",
                    user     = os.getenv("PG_USER") or "gedgar",
                    password = os.getenv("PG_PASSWORD") or os.getenv("POSTGRES_PASSWORD") or "",
                })

                local ok, err = pg:connect()
                if not ok then
                    ngx.status = 500
                    ngx.say('{"error":"' .. (err or "connect failed") .. '"}')
                    return
                end

                local sql = string.format([[
                    SELECT name, properties::text as properties, data::text as data, path::text as path
                    FROM knowledge_base
                    WHERE knowledge_base = 'system'
                      AND label = 'container'
                      AND path::text LIKE 'system.site.main.cpu.%s.container.%%'
                      AND nlevel(path) = 5
                    ORDER BY name
                ]], pg:escape_literal(cpu):sub(2,-2))

                local res, err = pg:query(sql)
                pg:keepalive()

                if not res then
                    ngx.status = 500
                    ngx.say('{"error":"' .. (err or "query failed") .. '"}')
                    return
                end

                local containers = {}
                for _, row in ipairs(res) do
                    local data = cjson.decode(row.data or "{}")
                    local props = cjson.decode(row.properties or "{}")
                    containers[#containers + 1] = {
                        name        = row.name,
                        path        = row.path,
                        type        = props.type or "",
                        description = props.description or "",
                        image       = data.image or "",
                        sqlite_db   = data.sqlite_db,
                    }
                end

                ngx.say(cjson.encode({ containers = containers }))
            }
        }

        # API: robots for a domain
        location /api/robots {
            default_type application/json;
            content_by_lua_block {
                local pgmoon = require("pgmoon")
                local cjson = require("cjson")

                local args = ngx.req.get_uri_args()
                local domain = args.domain
                if not domain then
                    ngx.status = 400
                    ngx.say('{"error":"missing domain parameter"}')
                    return
                end

                local pg = pgmoon.new({
                    host     = os.getenv("PG_HOST") or "172.17.0.1",
                    port     = tonumber(os.getenv("PG_PORT") or "5432"),
                    database = os.getenv("PG_DBNAME") or "knowledge_base",
                    user     = os.getenv("PG_USER") or "gedgar",
                    password = os.getenv("PG_PASSWORD") or os.getenv("POSTGRES_PASSWORD") or "",
                })

                local ok, err = pg:connect()
                if not ok then
                    ngx.status = 500
                    ngx.say('{"error":"' .. (err or "connect failed") .. '"}')
                    return
                end

                local path_prefix = "subsystems.domain." .. domain
                local sql = string.format([[
                    SELECT name, properties::text as properties, data::text as data, path::text as path
                    FROM knowledge_base
                    WHERE knowledge_base = 'subsystems'
                      AND label = 'robot'
                      AND path::text LIKE '%s%%'
                    ORDER BY name
                ]], pg:escape_literal(path_prefix):sub(2,-2))

                local res, err = pg:query(sql)
                pg:keepalive()

                if not res then
                    ngx.status = 500
                    ngx.say('{"error":"' .. (err or "query failed") .. '"}')
                    return
                end

                local robots = {}
                for _, row in ipairs(res) do
                    local data = cjson.decode(row.data or "{}")
                    local props = cjson.decode(row.properties or "{}")
                    robots[#robots + 1] = {
                        name         = row.name,
                        path         = row.path,
                        transport    = props.transport or "",
                        wire_format  = props.wire_format or "",
                        capabilities = data.capabilities or {},
                    }
                end

                ngx.say(cjson.encode({ robots = robots }))
            }
        }

        # API: services for a container
        location /api/services {
            default_type application/json;
            content_by_lua_block {
                local pgmoon = require("pgmoon")
                local cjson = require("cjson")

                local args = ngx.req.get_uri_args()
                local container_path = args.container_path
                if not container_path then
                    ngx.status = 400
                    ngx.say('{"error":"missing container_path parameter"}')
                    return
                end

                local pg = pgmoon.new({
                    host     = os.getenv("PG_HOST") or "172.17.0.1",
                    port     = tonumber(os.getenv("PG_PORT") or "5432"),
                    database = os.getenv("PG_DBNAME") or "knowledge_base",
                    user     = os.getenv("PG_USER") or "gedgar",
                    password = os.getenv("PG_PASSWORD") or os.getenv("POSTGRES_PASSWORD") or "",
                })

                local ok, err = pg:connect()
                if not ok then
                    ngx.status = 500
                    ngx.say('{"error":"' .. (err or "connect failed") .. '"}')
                    return
                end

                local sql = string.format([[
                    SELECT name, properties::text as properties, data::text as data, path::text as path
                    FROM knowledge_base
                    WHERE knowledge_base = 'system'
                      AND label = 'service'
                      AND path::text LIKE '%s.%%'
                    ORDER BY name
                ]], pg:escape_literal(container_path):sub(2,-2))

                local res, err = pg:query(sql)
                pg:keepalive()

                if not res then
                    ngx.status = 500
                    ngx.say('{"error":"' .. (err or "query failed") .. '"}')
                    return
                end

                local services = {}
                for _, row in ipairs(res) do
                    local data = cjson.decode(row.data or "{}")
                    local props = cjson.decode(row.properties or "{}")
                    services[#services + 1] = {
                        name     = row.name,
                        path     = row.path,
                        protocol = props.protocol or "",
                        data     = data,
                    }
                end

                ngx.say(cjson.encode({ services = services }))
            }
        }

        # API: single node by path
        location /api/node {
            default_type application/json;
            content_by_lua_block {
                local pgmoon = require("pgmoon")
                local cjson = require("cjson")

                local args = ngx.req.get_uri_args()
                local path = args.path
                local kb = args.kb or "system"
                if not path then
                    ngx.status = 400
                    ngx.say('{"error":"missing path parameter"}')
                    return
                end

                local pg = pgmoon.new({
                    host     = os.getenv("PG_HOST") or "172.17.0.1",
                    port     = tonumber(os.getenv("PG_PORT") or "5432"),
                    database = os.getenv("PG_DBNAME") or "knowledge_base",
                    user     = os.getenv("PG_USER") or "gedgar",
                    password = os.getenv("PG_PASSWORD") or os.getenv("POSTGRES_PASSWORD") or "",
                })

                local ok, err = pg:connect()
                if not ok then
                    ngx.status = 500
                    ngx.say('{"error":"' .. (err or "connect failed") .. '"}')
                    return
                end

                local sql = string.format(
                    "SELECT label, name, properties::text as properties, data::text as data, path::text as path FROM knowledge_base WHERE knowledge_base = %s AND path::text = %s",
                    pg:escape_literal(kb), pg:escape_literal(path))

                local res, err = pg:query(sql)
                pg:keepalive()

                if not res or #res == 0 then
                    ngx.status = 404
                    ngx.say('{"error":"not found","path":' .. cjson.encode(path) .. '}')
                    return
                end

                local row = res[1]
                local data = cjson.decode(row.data or "{}")
                local props = cjson.decode(row.properties or "{}")

                ngx.say(cjson.encode({
                    name       = row.name,
                    label      = row.label,
                    path       = row.path,
                    properties = props,
                    data       = data,
                }))
            }
        }

        # API: subtree under a path prefix
        location /api/subtree {
            default_type application/json;
            content_by_lua_block {
                local pgmoon = require("pgmoon")
                local cjson = require("cjson")

                local args = ngx.req.get_uri_args()
                local path = args.path
                local kb = args.kb or "system"
                if not path then
                    ngx.status = 400
                    ngx.say('{"error":"missing path parameter"}')
                    return
                end

                local pg = pgmoon.new({
                    host     = os.getenv("PG_HOST") or "172.17.0.1",
                    port     = tonumber(os.getenv("PG_PORT") or "5432"),
                    database = os.getenv("PG_DBNAME") or "knowledge_base",
                    user     = os.getenv("PG_USER") or "gedgar",
                    password = os.getenv("PG_PASSWORD") or os.getenv("POSTGRES_PASSWORD") or "",
                })

                local ok, err = pg:connect()
                if not ok then
                    ngx.status = 500
                    ngx.say('{"error":"' .. (err or "connect failed") .. '"}')
                    return
                end

                local sql = string.format([[
                    SELECT label, name, properties::text as properties, data::text as data, path::text as path
                    FROM knowledge_base
                    WHERE knowledge_base = %s
                      AND path::text LIKE '%s%%'
                    ORDER BY path
                ]], pg:escape_literal(kb), pg:escape_literal(path):sub(2,-2))

                local res, err = pg:query(sql)
                pg:keepalive()

                if not res then
                    ngx.status = 500
                    ngx.say('{"error":"' .. (err or "query failed") .. '"}')
                    return
                end

                local nodes = {}
                for _, row in ipairs(res) do
                    local data = cjson.decode(row.data or "{}")
                    local props = cjson.decode(row.properties or "{}")
                    nodes[#nodes + 1] = {
                        name       = row.name,
                        label      = row.label,
                        path       = row.path,
                        properties = props,
                        data       = data,
                    }
                end

                ngx.say(cjson.encode({ nodes = nodes }))
            }
        }
    }
}
