# NATS Server (JetStream enabled), no auth, RAM-only via tmpfs mount at /data.
server_name: nats-js-ram

port: 4222
http: 8222

jetstream: {
  store_dir: "/data"     # This path will be a tmpfs (RAM) mount
  max_mem: 50MB          # Cap total JetStream memory usage
  max_file: 50MB         # Extra safety; with tmpfs it's still RAM
}

# (Optional) Tighten general server limits if you like
# limits: { max_payload: 1048576 }  # 1 MiB

